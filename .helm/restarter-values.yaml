---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restarter-udl
  namespace: udl
spec:
  concurrencyPolicy: Allow
  jobTemplate:
    metadata:
      namespace: udl
    spec:
      template:
        spec:
          containers:
            - env:
                - name: LABEL_SELECTOR
                  value: app=udl
                - name: NAMESPACE
                  value: udl
              image: ghcr.io/dodgeball-tf/cronrestarter:latest
              imagePullPolicy: Always
              name: restarter-udl
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: default
          serviceAccountName: default
          terminationGracePeriodSeconds: 30
  schedule: 0 4 * * *
  suspend: false
