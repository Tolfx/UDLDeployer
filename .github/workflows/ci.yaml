name: Docker Image - UDL Scripts

on:
  push:
    paths:
      - 'cmd/**'
      - 'internal/**'
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Docker login
        env:
          CR_PAT: ${{ secrets.CP_PAT }}
        run: echo $CR_PAT | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag ghcr.io/dodgeball-tf/udlscripts:latest
      - name: Docker push
        run: docker push ghcr.io/dodgeball-tf/udlscripts:latest
